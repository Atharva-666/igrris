# =============================================================================
# rules_config.yaml — Igrris AI Label Rule Engine Configuration
#
# Edit this file to tune classification without touching any Python code.
# All keyword matches are case-insensitive substring searches.
# Domain matches check the sender email address (after the @ symbol).
# =============================================================================

# ---------------------------------------------------------------------------
# Confidence threshold — emails below this go to "Needs Review"
# ---------------------------------------------------------------------------
confidence_threshold: 0.70

# ---------------------------------------------------------------------------
# Label priority order — highest priority first
# ---------------------------------------------------------------------------
priority:
  - Phishing
  - Spam
  - Security
  - Needs Review
  - Banking
  - Orders
  - Work
  - Education
  - Promotions
  - Personal
  - Trusted

# ---------------------------------------------------------------------------
# Label color definitions (Gmail fixed palette hex values)
# ---------------------------------------------------------------------------
label_colors:
  Trusted:      { textColor: "#ffffff", backgroundColor: "#16a765" }
  Spam:         { textColor: "#ffffff", backgroundColor: "#cc3a21" }
  Needs Review: { textColor: "#000000", backgroundColor: "#f2c960" }
  Phishing:     { textColor: "#ffffff", backgroundColor: "#a61c00" }
  Security:     { textColor: "#ffffff", backgroundColor: "#4a86e8" }
  Banking:      { textColor: "#ffffff", backgroundColor: "#0d7377" }
  Orders:       { textColor: "#ffffff", backgroundColor: "#8e63ce" }
  Promotions:   { textColor: "#ffffff", backgroundColor: "#e07c24" }
  Education:    { textColor: "#ffffff", backgroundColor: "#07b6d5" }
  Work:         { textColor: "#ffffff", backgroundColor: "#2c5f8a" }
  Personal:     { textColor: "#ffffff", backgroundColor: "#5f6368" }

# ---------------------------------------------------------------------------
# PHISHING rules
# ---------------------------------------------------------------------------
phishing:
  subject_keywords:
    - "verify your account"
    - "confirm your identity"
    - "update your payment"
    - "your account has been suspended"
    - "unauthorized login attempt"
    - "click here to verify"
    - "enter your otp"
    - "otp for"
    - "one-time password"
    - "your password has expired"
    - "reset your password immediately"
    - "suspicious activity detected"
    - "account will be closed"
    - "verify your email address"
    - "confirm your login"
    - "validate your account"
    - "recover your account"
    - "billing information required"
    - "payment method declined"
    - "update your credit card"
    - "dear valued customer"
    - "click the link below to verify"
    - "your account will be deactivated"
    - "act now to avoid suspension"
    - "claim your reward"
    - "you have been selected"
    - "winner notification"
    - "lottery winner"
    - "you've won"
    - "congratulations you have been chosen"
    - "free gift claim"
    - "urgent: action required"
    - "account locked verify now"
  body_keywords:
    - "verify your identity"
    - "enter your password"
    - "click here to login"
    - "your account is at risk"
    - "we detected unusual activity"
    - "confirm your account details"
    - "provide your banking details"
    - "log in to avoid suspension"
    - "immediate action required"
    - "your ssn"
    - "your aadhaar"
    - "provide your card number"
  suspicious_domain_patterns:
    - ".*-secure\\..*"
    - ".*account.*verify.*"
    - ".*login.*support.*"
    - ".*secure.*login.*"
    - ".*verify.*account.*"

# ---------------------------------------------------------------------------
# SECURITY rules — login/2FA/device alerts from known identity providers
# NOTE: BOTH a domain match AND a keyword match are required.
#       Domain alone is NOT enough — social notifications from these domains
#       will fall through to Promotions/Personal correctly.
# ---------------------------------------------------------------------------
security:
  subject_keywords:
    - "new sign-in"
    - "new login"
    - "new device"
    - "sign-in attempt"
    - "login attempt"
    - "two-factor authentication"
    - "2-step verification"
    - "two-step verification"
    - "verification code"
    - "authentication code"
    - "security code"
    - "account recovery"
    - "password changed"
    - "password reset"
    - "your password was changed"
    - "security alert"
    - "unusual sign-in"
    - "suspicious login"
    - "new device added"
    - "account access"
    - "review recent activity"
    - "sign in from new"
    - "access from new"
    - "your account was accessed"
    - "login from unfamiliar"
    - "we noticed a sign-in"
    - "critical security"
    - "recovery code"
    - "backup code"
    - "2fa enabled"
    - "authenticator app"
  body_keywords:
    - "two-factor authentication"
    - "2-step verification"
    - "new device signed in"
    - "we noticed a new sign-in"
    - "your verification code is"
    - "use this code to verify"
    - "security code:"
    - "authentication code:"
    - "one-time passcode"
    - "your sign-in code"
    - "login verification"
  # Identity providers and major services that send REAL security alerts.
  # Social media domains deliberately excluded — their security emails
  # will still match via subject_keywords above.
